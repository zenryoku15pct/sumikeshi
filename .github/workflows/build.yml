# スミケシの実行ファイルを自動ビルドする（Python不要版の配布物）
#
# - 手動実行（workflow_dispatch）: ビルドが通るかの確認用。成果物はArtifactsに残る
# - vX.Y.Z タグのpush: ビルドしてReleaseに自動添付する
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-apple-silicon
          # Intel Mac（macos-13）は実行環境の提供終了により対象外。
          # Intel Macの利用者はソース版（セットアップ.command）を使う
    runs-on: ${{ matrix.os }}
    env:
      # WindowsのCIは画面出力が cp1252 で、日本語を print した時点で止まる
      # （2026-09-26 make_leak_samples.py で実測）。UTF-8に揃える
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリを導入
        run: pip install -r requirements.txt

      - name: PyInstallerを導入（起動用の殻をその場でコンパイル）
        # 配布済みの既製バイナリの殻（bootloader）はマルウェアにも流用されるため、殻の
        # 指紋だけでウイルス対策ソフトに誤検知される（実例：ウイルスバスター
        # Troj.Win32.TRX系・2026-08）。その場で作った殻は指紋が既知のものと一致しない
        # ので、この誤検知を避けられる。
        # 注意: ソース配布物にもコンパイル済みの殻が同梱されているため、pip install
        # --no-binary では作り直されない。bootloader/ で waf を実行するのが正規の手順。
        shell: bash
        run: |
          pip download pyinstaller --no-deps --no-binary pyinstaller -d pyi-src
          cd pyi-src
          tar xf pyinstaller-*.tar.gz
          cd pyinstaller-*/bootloader
          python ./waf all
          cd ..
          pip install .

      - name: お試し用PDFを生成
        run: python make_dummy_sample.py

      - name: 漏れサンプルを生成
        run: python make_leak_samples.py

      - name: テスト（中核・画面の動き・漏れの検出・過去の事故の再発）
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_core.py
          python tests/test_gui.py
          python tests/test_regressions.py

      - name: ビルド
        run: pyinstaller --noconfirm --clean sumikeshi.spec

      - name: 動作確認（自己診断が通るか）
        # 画面を出さないアプリなので「起動してヘルプ」では確かめられない。
        # --selftest は Qt を起動せずにマスキング中核を走らせて終わる隠しの入口。
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/sumikeshi/sumikeshi.exe --selftest
          else
            "./dist/スミケシ.app/Contents/MacOS/sumikeshi" --selftest
          fi

      - name: 配布物を組み立てる
        # ZIPだけ受け取った人が、GitHubへ戻らずに使い方を読めるようにする。
        # LICENSEの同梱はAGPL-3.0の要件でもある。
        # 説明書は .md ではなく .txt で入れる。Windowsは .md に既定の関連付けが無く、
        # macOSも既定アプリが未設定のことが多いため、どちらもダブルクリックで開けない
        # （2026-08-18に実機確認）。中身はREADME.mdと同一。
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PKG="dist/sumikeshi"          # exeの入ったフォルダがそのまま配布物
          else
            # macOSは .app 単体では説明書を同梱できないので、包むフォルダを作る。
            # PyInstallerが残す dist/sumikeshi（.appの材料）は配布しない
            PKG="dist/スミケシ"
            mkdir -p "$PKG"
            mv "dist/スミケシ.app" "$PKG/"
            rm -rf dist/sumikeshi
          fi
          cp LICENSE "$PKG/"
          cp README.md "$PKG/はじめにお読みください.txt"
          mkdir -p "$PKG/お試し用PDF"
          cp "samples/ダミー調査票.pdf" "$PKG/お試し用PDF/"

      - name: ZIP化（macOS）
        # -y はシンボリックリンクを保つ指定。Qtのフレームワークはリンクで組まれて
        # いるので、これを外すと展開したアプリが起動しなくなる
        run: cd dist && zip -ry ../sumikeshi-${{ matrix.label }}.zip スミケシ
        if: runner.os == 'macOS'

      - name: ZIP化（Windows）
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/sumikeshi -DestinationPath sumikeshi-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v4
        # 非公開リポジトリの保管枠（500MB）が埋まると、ここで止まってReleaseへの添付まで
        # 届かなくなる（2026-09-26実測・v1時代の19本で約660MB）。保管は補助なので止めない
        continue-on-error: true
        with:
          name: sumikeshi-${{ matrix.label }}
          path: sumikeshi-${{ matrix.label }}.zip

      - name: 下書きReleaseに添付（手動実行のとき・実機テスト用）
        # 下書きは公開されず、保管枠も使わない。実機テストの受け取り口
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: 実機テスト用（下書き・公開しない）
          draft: true
          files: sumikeshi-${{ matrix.label }}.zip

      - name: Releaseに添付（タグ時のみ）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sumikeshi-${{ matrix.label }}.zip
