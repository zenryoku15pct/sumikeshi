# スミケシの実行ファイルを自動ビルドする（Python不要版の配布物）
#
# - 手動実行（workflow_dispatch）: ビルドが通るかの確認用。成果物はArtifactsに残る
# - vX.Y.Z タグのpush: ビルドしてReleaseに自動添付する
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-apple-silicon
          # Intel Mac（macos-13）は実行環境の提供終了により対象外。
          # Intel Macの利用者はソース版（セットアップ.command）を使う
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリを導入
        run: pip install -r requirements.txt

      - name: PyInstallerを導入（起動用の殻をその場でコンパイル）
        # 配布済みの既製バイナリの殻（bootloader）はマルウェアにも流用されるため、殻の
        # 指紋だけでウイルス対策ソフトに誤検知される（実例：ウイルスバスター
        # Troj.Win32.TRX系・2026-08）。その場で作った殻は指紋が既知のものと一致しない
        # ので、この誤検知を避けられる。
        # 注意: ソース配布物にもコンパイル済みの殻が同梱されているため、pip install
        # --no-binary では作り直されない。bootloader/ で waf を実行するのが正規の手順。
        shell: bash
        run: |
          pip download pyinstaller --no-deps --no-binary pyinstaller -d pyi-src
          cd pyi-src
          tar xf pyinstaller-*.tar.gz
          cd pyinstaller-*/bootloader
          python ./waf all
          cd ..
          pip install .

      - name: ビルド
        run: pyinstaller --noconfirm --clean sumikeshi.spec

      - name: 動作確認（起動してヘルプが出るか）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/sumikeshi/sumikeshi-check.exe --help > /dev/null
          else
            ./dist/sumikeshi/sumikeshi-check --help > /dev/null
          fi

      - name: 説明書・ライセンス・お試し用PDFを同梱
        # ZIPだけ受け取った人が、GitHubへ戻らずに使い方を読めるようにする。
        # LICENSEの同梱はAGPL-3.0の要件でもある。
        # Windowsは .md に既定の関連付けが無くダブルクリックで開けないため、
        # 同じ中身を「はじめにお読みください.txt」の名前で入れる。
        shell: bash
        run: |
          cp LICENSE dist/sumikeshi/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp README.md "dist/sumikeshi/はじめにお読みください.txt"
          else
            cp README.md dist/sumikeshi/
          fi
          python make_dummy_sample.py
          mkdir -p "dist/sumikeshi/お試し用PDF"
          cp "samples/ダミー調査票.pdf" "dist/sumikeshi/お試し用PDF/"

      - name: ZIP化（macOS）
        if: runner.os == 'macOS'
        run: cd dist && zip -ry ../sumikeshi-${{ matrix.label }}.zip sumikeshi

      - name: ZIP化（Windows）
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/sumikeshi -DestinationPath sumikeshi-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sumikeshi-${{ matrix.label }}
          path: sumikeshi-${{ matrix.label }}.zip

      - name: Releaseに添付（タグ時のみ）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sumikeshi-${{ matrix.label }}.zip
